<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECME 디자인 뷰어 · 54안</title>
<style>
  :root { --bg:#f4f6f9; --panel:#fff; --ink:#0f172a; --mute:#64748b; --line:#e5e9f0; --acc:#4338ca; --accbg:#eef0ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  body { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
  header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  .cur { min-width: 0; flex: 1; }
  .cur b { font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cur span { font-size: 12.5px; color: var(--mute); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btns { display: flex; gap: 6px; align-items: center; flex: none; }
  button, .a { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
  button:hover, .a:hover { border-color: #c7cdda; background: #f8fafc; }
  button.on { background: var(--accbg); border-color: #c9cdfb; color: var(--acc); }
  .count { font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; min-width: 56px; text-align: center; }
  select { display: none; font: inherit; font-size: 13px; padding: 7px; border-radius: 8px; border: 1px solid var(--line); max-width: 100%; }
  nav { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 8px 0 24px; }
  nav h2 { font-size: 11.5px; letter-spacing: .05em; color: var(--mute); margin: 16px 16px 6px; font-weight: 700; }
  nav a { display: block; padding: 7px 16px; font-size: 13.5px; color: var(--ink); text-decoration: none; border-left: 3px solid transparent; }
  nav a small { display: block; font-size: 11.5px; color: var(--mute); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav a:hover { background: #f8fafc; }
  nav a.sel { background: var(--accbg); border-left-color: var(--acc); color: var(--acc); font-weight: 600; }
  main { position: relative; overflow: hidden; min-width: 0; }
  #wrap { position: absolute; inset: 0; overflow-x: auto; overflow-y: scroll; }
  #stage { transform-origin: 0 0; background: #fff; box-shadow: 0 0 0 1px var(--line); }
  iframe { display: block; border: 0; width: 1440px; background: #fff; }
  .hint { position: absolute; right: 14px; bottom: 12px; font-size: 12px; color: var(--mute); background: rgba(255,255,255,.9); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); pointer-events: none; }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    nav { display: none; }
    select { display: block; }
    header { flex-wrap: wrap; }
    .btns { flex-wrap: wrap; }
    #fit, #open { display: none; }
    header h1, .hint { display: none; }
    .cur { flex-basis: 100%; order: 3; }
  }
</style>
</head>
<body>
<header>
  <h1>ECME 디자인 뷰어</h1>
  <select id="pick" aria-label="디자인 선택"></select>
  <div class="cur"><b id="ttl"></b><span id="dsc"></span></div>
  <div class="btns">
    <button id="prev" title="이전 (←)">← 이전</button>
    <span class="count" id="cnt"></span>
    <button id="next" title="다음 (→)">다음 →</button>
    <button id="replay" title="애니메이션 다시 재생 (R)">↻ 다시 재생</button>
    <button id="fit" class="on" title="화면 맞춤 / 실제 크기 (F)">화면 맞춤</button>
    <a class="a" id="open" target="_blank" title="새 탭에서 실제 크기로">새 탭 ↗</a>
  </div>
</header>
<nav id="list" aria-label="디자인 목록"></nav>
<main>
  <div id="wrap"><div id="stage"><iframe id="frame" title="디자인 미리보기"></iframe></div></div>
  <div class="hint">← → 이동 · R 다시 재생 · F 맞춤 전환</div>
</main>
<script>
const ITEMS = [{"file": "Main.dc.html", "title": "C · Bold Editorial (현재 사이트)", "desc": "다크 네이비 에디토리얼 · dgistecme.github.io 적용 중", "group": "적용 중 · 라이브"}, {"file": "DirectionAN.dc.html", "title": "AN · Reference Classic", "desc": "레퍼런스 최근접, 사진 배너 오버레이, 사진 뉴스 카드", "group": "레퍼런스 수준 (색·모션 상한)"}, {"file": "DirectionAO.dc.html", "title": "AO · Clean Split", "desc": "좌우 분할 히어로, 아이콘 연구 목록", "group": "레퍼런스 수준 (색·모션 상한)"}, {"file": "DirectionAP.dc.html", "title": "AP · Centered Statement", "desc": "가운데 제목 + 사진 + 겹친 통계", "group": "레퍼런스 수준 (색·모션 상한)"}, {"file": "DirectionAQ.dc.html", "title": "AQ · Sidebar Profile", "desc": "왼쪽 프로필 열, 뉴스 타임라인", "group": "레퍼런스 수준 (색·모션 상한)"}, {"file": "DirectionAR.dc.html", "title": "AR · Research Tabs", "desc": "연구 탭 패널, 좌 제목/우 사진, 아이콘 통계 띠", "group": "레퍼런스 수준 (색·모션 상한)"}, {"file": "DirectionAS.dc.html", "title": "AS · News-first", "desc": "얇은 히어로 + 큰 사진 뉴스 우선, PI + Join 카드", "group": "레퍼런스 수준 (색·모션 상한)"}, {"file": "DirectionAT.dc.html", "title": "AT · Photo Band", "desc": "상단 사진 3장 띠, 가운데 제목, 2단 뉴스", "group": "레퍼런스 수준 (색·모션 상한)"}, {"file": "DirectionAU.dc.html", "title": "AU · Card Stack", "desc": "큰 소개 카드 + 사진·최신 카드, 3카드 요약", "group": "레퍼런스 수준 (색·모션 상한)"}, {"file": "DirectionAV.dc.html", "title": "AV · Research First", "desc": "연구 5개를 히어로 바로 아래 주인공으로, 전체 사이트 후보", "group": "레퍼런스 수준 (색·모션 상한)"}, {"file": "DirectionAW.dc.html", "title": "AW · Editorial Photo-left", "desc": "사진 왼쪽 히어로, 대표 논문 띠, 키워드 칩", "group": "레퍼런스 수준 (색·모션 상한)"}, {"file": "DirectionAX.dc.html", "title": "AX · Lab Portal", "desc": "3카드 포털 히어로, 페이지 바로가기 타일", "group": "레퍼런스 수준 (색·모션 상한)"}, {"file": "DirectionAJ.dc.html", "title": "AJ · Gradient Glass Editorial", "desc": "메시 그라데이션 + 유리 카드, 세리프, 절제 모션", "group": "절제된 화려함"}, {"file": "DirectionAK.dc.html", "title": "AK · Bright Photo Magazine", "desc": "사진 콜라주 + 색면, 잡지 섹션, 무한 루프 없음", "group": "절제된 화려함"}, {"file": "DirectionAL.dc.html", "title": "AL · Soft Clay 3D", "desc": "파스텔 점토 조형, 둥근 서체, 절제 모션", "group": "절제된 화려함"}, {"file": "DirectionAM.dc.html", "title": "AM · Premium Academic", "desc": "명문대 연구실 결, 세리프, 무한 루프 없음", "group": "절제된 화려함"}, {"file": "DirectionAD.dc.html", "title": "AD · Liquid Chrome", "desc": "gooey 액체금속 블롭, 블롭 사진, 크롬 글자, 물방울 카드", "group": "6가지 콘셉트"}, {"file": "DirectionAE.dc.html", "title": "AE · Isometric Lab World", "desc": "아이소메트릭 섬, 에너지 흐름, 연구 섬", "group": "6가지 콘셉트"}, {"file": "DirectionAF.dc.html", "title": "AF · Lab OS Dashboard", "desc": "글래스 OS 창, 오실로스코프, 게이지, 터미널, 알림 뉴스", "group": "6가지 콘셉트"}, {"file": "DirectionAG.dc.html", "title": "AG · Paper Cut Layers", "desc": "종이 언덕 시차, 종이 태양, 폴라로이드, 매달린 태그", "group": "6가지 콘셉트"}, {"file": "DirectionAH.dc.html", "title": "AH · Ripple Dot Grid", "desc": "점 물결 필드, 미니멀 타이포, 순차 점등 그리드", "group": "6가지 콘셉트"}, {"file": "DirectionAI.dc.html", "title": "AI · Spotlight Gallery", "desc": "글자 웨이브, 필름스트립, 플립 카드, 카드 덱", "group": "6가지 콘셉트"}, {"file": "DirectionZ.dc.html", "title": "Z · Holo Prism", "desc": "크롬 헤드라인, 3D 기울기 홀로 포일 카드, 유리 구슬", "group": "Fancy · 시그니처 모션"}, {"file": "DirectionAA.dc.html", "title": "AA · Exploded Device", "desc": "나노발전기 4층 3D 분해, 전압 파형, 자동 아코디언", "group": "Fancy · 시그니처 모션"}, {"file": "DirectionAB.dc.html", "title": "AB · Energy Field", "desc": "입자 흡수 허브, 단어 회전, 숫자 카운터, 타임라인", "group": "Fancy · 시그니처 모션"}, {"file": "DirectionAC.dc.html", "title": "AC · Cinematic Type", "desc": "사진 채운 430px ECME, 이중 기울기 마퀴, 컬러 블록", "group": "Fancy · 시그니처 모션"}, {"file": "DirectionV.dc.html", "title": "V · Prism Mesh", "desc": "유동 메시 그라데이션, 단어 리빌, 회전 테두리, 세로 뉴스 마퀴", "group": "레퍼런스 결 + 세련된 모션"}, {"file": "DirectionW.dc.html", "title": "W · Liquid Glass", "desc": "유동 그라데이션 스테이지, 글래스 패널 빛줄기, 모프 블롭 사진, 가로 마퀴", "group": "레퍼런스 결 + 세련된 모션"}, {"file": "DirectionX.dc.html", "title": "X · Kinetic Spotlight", "desc": "초대형 타이포 스포트라이트, 펄스 라인 + 이동 광점, 프로그레스 링", "group": "레퍼런스 결 + 세련된 모션"}, {"file": "DirectionY.dc.html", "title": "Y · Flow Ribbons", "desc": "점선 리본 흐름, 평행사변형 사진, 파형 노드 + 왕복 광점, 3D 플립 뉴스", "group": "레퍼런스 결 + 세련된 모션"}, {"file": "DirectionS.dc.html", "title": "S · Glow Cards", "desc": "풀블리드 사진 히어로, 그라데이션 제목, 글래스 카드, 컬러 태그", "group": "레퍼런스 결 (밝고 화려)"}, {"file": "DirectionT.dc.html", "title": "T · Aurora", "desc": "파스텔 블롭, 라운드 사진 + 부유 통계 칩, 5색 타일", "group": "레퍼런스 결 (밝고 화려)"}, {"file": "DirectionU.dc.html", "title": "U · Spectrum", "desc": "곡선 사진 카드, 스펙트럼 테두리, 캐러셀", "group": "레퍼런스 결 (밝고 화려)"}, {"file": "DirectionN.dc.html", "title": "N · Orbit", "desc": "동심원 링 + 원형 사진, 공전 노드 애니메이션", "group": "Orbit 계열 (기하 모티프 + 애니메이션)"}, {"file": "DirectionP.dc.html", "title": "P · Waveform", "desc": "사인파 + 알약형 사진, 파형 위 연구 노드", "group": "Orbit 계열 (기하 모티프 + 애니메이션)"}, {"file": "DirectionQ.dc.html", "title": "Q · Hex Lattice", "desc": "육각 격자 + 육각 사진/셀", "group": "Orbit 계열 (기하 모티프 + 애니메이션)"}, {"file": "DirectionR.dc.html", "title": "R · Signal Field", "desc": "점 필드 + 신호 링 퍼짐 + 통계 바", "group": "Orbit 계열 (기하 모티프 + 애니메이션)"}, {"file": "DirectionNA.dc.html", "title": "NA · Orbit Refined", "desc": "원형 사진 중심 궤도 + 연구 5칩, 절제 모션, 전체 사이트 후보", "group": "Orbit 계열 (기하 모티프 + 애니메이션)"}, {"file": "DirectionNB.dc.html", "title": "NB · Orbit Split", "desc": "분할 히어로 + 궤도 다이어그램 연구", "group": "Orbit 계열 (기하 모티프 + 애니메이션)"}, {"file": "DirectionNC.dc.html", "title": "NC · Energy Loop", "desc": "연구를 하나의 고리로 잇는 다이어그램", "group": "Orbit 계열 (기하 모티프 + 애니메이션)"}, {"file": "DirectionM.dc.html", "title": "M · Overlap Editorial", "desc": "순백, 초대형 아웃라인 타이포 + 기울어진 사진 겹침", "group": "흰 배경 · 강한 구성"}, {"file": "DirectionO.dc.html", "title": "O · Vertical Rail", "desc": "순백, 세로 레일 + 굵은 룰 + 흑백 사진", "group": "흰 배경 · 강한 구성"}, {"file": "DirectionJ.dc.html", "title": "J · Hairline Magazine", "desc": "순백, 회색 룰선, 잡지 3단", "group": "흰 배경 · 순백"}, {"file": "DirectionK.dc.html", "title": "K · Serif Editorial", "desc": "순백, 세리프 대문장, 여백", "group": "흰 배경 · 순백"}, {"file": "DirectionL.dc.html", "title": "L · Bento Cards", "desc": "순백, 테두리 카드 그리드", "group": "흰 배경 · 순백"}, {"file": "DirectionG.dc.html", "title": "G · Sky Airy", "desc": "흰+하늘색, 라운드 사진, 파스텔 타일", "group": "밝은 톤"}, {"file": "DirectionH.dc.html", "title": "H · Mint Lab", "desc": "민트/라임 밴드, 유기 곡선 사진, 칩", "group": "밝은 톤"}, {"file": "DirectionI.dc.html", "title": "I · Warm Sunlight", "desc": "아이보리+코랄, 세리프 제목", "group": "밝은 톤"}, {"file": "DirectionD.dc.html", "title": "D · Swiss Grid", "desc": "흰/검/빨강 점, 모노 라벨", "group": "초기 탐색"}, {"file": "DirectionE.dc.html", "title": "E · Paper Journal", "desc": "크림 종이, 세리프, 학술지", "group": "초기 탐색"}, {"file": "DirectionF.dc.html", "title": "F · Photo Magazine", "desc": "세로 대제목 + 사진 모자이크 + 노랑", "group": "초기 탐색"}, {"file": "DirectionA.dc.html", "title": "A · Classic Academic", "desc": "네이비+금색", "group": "초기 탐색"}, {"file": "DirectionB.dc.html", "title": "B · Clean Modern", "desc": "흰 배경, 둥근 카드", "group": "초기 탐색"}, {"file": "Previous.dc.html", "title": "이전 · Wix 재현", "desc": "", "group": "초기 탐색"}];
const $ = (id) => document.getElementById(id);
const frame = $('frame'), stage = $('stage'), wrap = $('wrap');
let i = 0, fit = true;

// sidebar + mobile select, grouped
let lastGroup = null, og = null;
ITEMS.forEach((it, n) => {
  if (it.group !== lastGroup) {
    lastGroup = it.group;
    const h = document.createElement('h2'); h.textContent = it.group; $('list').appendChild(h);
    og = document.createElement('optgroup'); og.label = it.group; $('pick').appendChild(og);
  }
  const a = document.createElement('a');
  a.href = '#' + it.file.replace('.dc.html', '');
  a.innerHTML = '<span></span><small></small>';
  a.firstChild.textContent = it.title; a.lastChild.textContent = it.desc || it.file;
  a.onclick = (e) => { e.preventDefault(); go(n); };
  it.el = a; $('list').appendChild(a);
  const o = document.createElement('option'); o.value = n; o.textContent = it.title; og.appendChild(o);
});
$('pick').onchange = (e) => go(+e.target.value);

// The iframe is as tall as the whole design, so the only scrollbar is the viewer's own.
// (Opened as a local file, browsers may block reading the frame; then the frame keeps its own scrollbar.)
let pageH = null;
function measure() {
  try {
    const d = frame.contentDocument;
    d.documentElement.style.overflow = 'hidden';
    pageH = Math.max(600, d.documentElement.scrollHeight);
  } catch (e) { pageH = null; }
  layout();
}
function layout() {
  const w = wrap.clientWidth;
  const s = fit ? Math.min(1, w / 1440) : 1;
  if (pageH === null) { frame.style.height = Math.ceil(wrap.clientHeight / s) + 'px'; stage.style.transform = 'scale(' + s + ')'; stage.style.marginRight = (1440 * s - 1440) + 'px'; stage.style.marginBottom = (wrap.clientHeight - wrap.clientHeight / s) + 'px'; return; }
  frame.style.height = pageH + 'px';
  stage.style.width = '1440px';
  stage.style.transform = 'scale(' + s + ')';
  // shrink the layout box to the scaled size so scrolling matches what is visible
  stage.style.marginRight = (1440 * s - 1440) + 'px';
  stage.style.marginBottom = (pageH * s - pageH) + 'px';
}

function go(n) {
  i = (n + ITEMS.length) % ITEMS.length;
  const it = ITEMS[i];
  frame.src = it.file;
  $('ttl').textContent = it.title + '  ·  ' + it.group;
  $('dsc').textContent = it.desc || it.file;
  $('cnt').textContent = (i + 1) + ' / ' + ITEMS.length;
  $('open').href = it.file;
  $('pick').value = i;
  ITEMS.forEach((x) => x.el.classList.toggle('sel', x === it));
  it.el.scrollIntoView({ block: 'nearest' });
  history.replaceState(null, '', '#' + it.file.replace('.dc.html', ''));
  try { localStorage.setItem('ecme-viewer', i); } catch (e) {}
  wrap.scrollTo(0, 0);
}

function key(e) {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { go(i + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(i - 1); e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') $('replay').click();
  else if (e.key === 'f' || e.key === 'F') $('fit').click();
}
document.addEventListener('keydown', key);
// keys keep working after clicking inside the preview (same origin)
frame.addEventListener('load', () => {
  try { frame.contentWindow.document.addEventListener('keydown', key); } catch (e) {}
  measure(); setTimeout(measure, 800); // fonts/images can change the height
});

$('prev').onclick = () => go(i - 1);
$('next').onclick = () => go(i + 1);
$('replay').onclick = () => { try { frame.contentWindow.location.reload(); } catch (e) { frame.src = ITEMS[i].file; } };
$('fit').onclick = () => { fit = !fit; $('fit').classList.toggle('on', fit); $('fit').textContent = fit ? '화면 맞춤' : '실제 크기'; layout(); };
new ResizeObserver(layout).observe(wrap);

const hashIndex = () => ITEMS.findIndex((it) => '#' + it.file.replace('.dc.html', '') === location.hash);
window.addEventListener('hashchange', () => { const h = hashIndex(); if (h >= 0 && h !== i) go(h); });
